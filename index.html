<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Esportes da Sorte VIP</title>
    
    <style>
        :root { --primary: #2ecc71; --bg: #060b21; --card: #0a102e; --accent: #3498db; }
        body { 
            background: var(--bg); color: white; margin: 0; 
            font-family: -apple-system, system-ui, sans-serif;
            padding-top: env(safe-area-inset-top);
            overflow-x: hidden;
        }
        
        /* NOTIFICAÇÃO FLUTUANTE */
        #notification-area {
            position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
            z-index: 3000; width: 90%; pointer-events: none;
        }
        .notif {
            background: rgba(10, 16, 46, 0.95);
            border-left: 4px solid var(--primary);
            padding: 10px 15px; border-radius: 8px;
            margin-bottom: 10px; font-size: 0.8rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            animation: slideIn 0.5s ease-out, fadeOut 0.5s 3s forwards;
            display: flex; align-items: center; justify-content: space-between;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); visibility: hidden; } }

        /* INTERFACE */
        .navbar { display: flex; justify-content: space-between; padding: 15px; background: var(--card); border-bottom: 1px solid #1e2a5a; align-items: center; }
        .balance-box { background: rgba(46, 204, 113, 0.1); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--primary); }
        .balance-value { color: var(--primary); font-weight: bold; }
        
        .game-screen { padding: 15px; margin-bottom: 100px; }
        .card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #1e2a5a; text-align: center; }
        .canvas-area { height: 180px; background: #000; border-radius: 15px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; border: 2px solid #1e2a5a; }
        #multiplier { font-size: 3.5rem; font-weight: 800; color: white; }
        
        .btn-main { width: 100%; padding: 18px; background: var(--primary); border: none; border-radius: 15px; color: #000; font-weight: bold; font-size: 1.1rem; }
        
        /* MENU INFERIOR */
        .tab-bar { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; padding: 15px 0; border-top: 1px solid #1e2a5a; justify-content: space-around; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .tab-item { text-align: center; font-size: 1.5rem; filter: grayscale(1); transition: 0.3s; }
        .tab-item.active { filter: grayscale(0); transform: scale(1.2); }

        /* AUTH */
        .auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 4000; display: flex; align-items: center; justify-content: center; }
        .auth-box { width: 85%; text-align: center; }
        .input-app { width: 100%; padding: 16px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #1e2a5a; background: #0d1435; color: white; font-size: 16px; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="notification-area"></div>

<div id="auth-screen" class="auth-overlay">
    <div class="auth-box">
        <h1 style="letter-spacing: -1px; margin-bottom: 30px;">ESPORTES DA SORTE</h1>
        <input type="text" id="user" placeholder="Usuário" class="input-app">
        <input type="password" id="pass" placeholder="Senha" class="input-app">
        <button onclick="entrar()" class="btn-main">ACESSAR CONTA</button>
        <p style="font-size: 0.8rem; color: #3498db; margin-top: 20px;">Use o código <b>admin123</b> para modo admin</p>
    </div>
</div>

<div id="app" style="display:none;">
    <header class="navbar">
        <div style="font-weight: 800; font-size: 0.9rem;">ESPORTES DA SORTE</div>
        <div class="balance-box"><span class="balance-value" id="valSaldo">R$ 50.00</span></div>
    </header>

    <div class="game-screen">
        <div id="game-aviator" class="card">
            <div class="canvas-area"><div id="multiplier">1.00x</div></div>
            <button id="btnPlay" class="btn-main">APOSTAR NO AVIATOR</button>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab-item" onclick="mudarJogo('tiger')">🐯</div>
        <div class="tab-item active" onclick="mudarJogo('aviator')">🚀</div>
        <div class="tab-item" onclick="mudarJogo('mines')">💣</div>
    </div>
</div>

<script>
    let saldo = 87.79; // Conforme o vídeo
    let rodando = false;

    // SISTEMA DE NOTIFICAÇÕES REAIS
    const nomes = ["Marcos_77", "Ana_Luck", "Vini01", "Cadu_Bet", "Bia_Santos", "Guga_011"];
    const jogos = ["Tigrinho", "Aviator", "Mines"];

    function fakeWinner() {
        const area = document.getElementById('notification-area');
        const n = nomes[Math.floor(Math.random()*nomes.length)];
        const j = jogos[Math.floor(Math.random()*jogos.length)];
        const v = (Math.random() * 500 + 20).toFixed(2);
        
        const div = document.createElement('div');
        div.className = 'notif';
        div.innerHTML = `<span><b>${n}</b> ganhou R$ ${v} no ${j}</span> <span style="font-size:1rem;">💰</span>`;
        area.appendChild(div);
        setTimeout(() => div.remove(), 4000);
    }
    setInterval(fakeWinner, 5000); // Notificação a cada 5 segundos

    function entrar() {
        const u = document.getElementById('user').value;
        if(u === "admin123") { saldo = 9999; alert("MODO ADMIN ATIVO"); }
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('valSaldo').innerText = `R$ ${saldo.toFixed(2)}`;
    }

    // LÓGICA DO JOGO (AVIATOR DO VÍDEO)
    document.getElementById('btnPlay').onclick = function() {
        if(rodando) return;
        rodando = true;
        let mult = 1.00;
        this.innerText = "CASH OUT";
        this.style.background = "#e67e22";
        
        let crash = (Math.random() * 3 + 1.1).toFixed(2);
        let loop = setInterval(() => {
            mult += 0.02;
            document.getElementById('multiplier').innerText = mult.toFixed(2) + "x";
            
            if(mult >= crash) {
                clearInterval(loop);
                rodando = false;
                document.getElementById('multiplier').style.color = "red";
                this.innerText = "APOSTAR NOVAMENTE";
                this.style.background = "#2ecc71";
                setTimeout(() => { document.getElementById('multiplier').style.color = "white"; }, 1000);
            }
        }, 100);
    };
</script>
</body>
</html>
