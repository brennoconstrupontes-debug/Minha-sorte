<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Esportes da Sorte VIP Pro</title>
    <style>
        :root { --primary: #2ecc71; --bg: #060b21; --card: #0a102e; --accent: #3498db; --gold: #f1c40f; --danger: #e74c3c; }
        body { background: var(--bg); color: white; margin: 0; font-family: -apple-system, system-ui, sans-serif; padding-top: env(safe-area-inset-top); user-select: none; overflow-x: hidden; }
        
        /* AUTH */
        .auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .auth-box { width: 85%; text-align: center; background: var(--card); padding: 30px; border-radius: 25px; border: 1px solid #1e2a5a; }
        .input-app { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #1e2a5a; background: #060b21; color: white; font-size: 16px; box-sizing: border-box; }
        
        /* HEADER COM AS 3 BARRINHAS */
        .header { padding: 15px; background: var(--card); border-bottom: 1px solid #1e2a5a; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
        .menu-icon { font-size: 1.5rem; color: var(--primary); cursor: pointer; }
        .balance-btn { background: rgba(46, 204, 113, 0.1); padding: 8px 15px; border-radius: 25px; border: 1px solid var(--primary); color: var(--primary); font-weight: 800; }
        
        /* MENU LATERAL */
        .side-menu { position: fixed; top: 0; left: -100%; width: 280px; height: 100%; background: var(--card); z-index: 5000; transition: 0.4s; box-shadow: 10px 0 30px rgba(0,0,0,0.5); padding: 20px; box-sizing: border-box; }
        .side-menu.active { left: 0; }
        .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 4999; display: none; }
        .menu-overlay.active { display: block; }
        .menu-item { padding: 15px; border-bottom: 1px solid #1e2a5a; display: flex; align-items: center; gap: 10px; font-weight: bold; }

        /* VIP BAR */
        .vip-container { padding: 10px 15px; background: var(--card); }
        .vip-bar-bg { background: #1e2a5a; height: 6px; border-radius: 10px; margin-top: 5px; overflow: hidden; }
        #vip-progress { background: linear-gradient(to right, var(--accent), var(--gold)); height: 100%; width: 0%; transition: 0.5s; }

        /* JOGOS */
        .game-container { padding: 15px; margin-bottom: 100px; }
        .game-card { background: var(--card); border-radius: 25px; padding: 20px; border: 1px solid #1e2a5a; text-align: center; display: none; }
        .game-card.active { display: block; }
        .display-main { height: 160px; background: #000; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; border: 2px solid #1e2a5a; }
        
        /* SELETOR DE APOSTA */
        .bet-selector { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 15px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 15px; }
        .bet-btn { background: #1e2a5a; border: 1px solid var(--accent); color: white; width: 35px; height: 35px; border-radius: 50%; }

        /* BOTÕES */
        .btn-play { width: 100%; padding: 18px; background: var(--primary); border: none; border-radius: 15px; color: #000; font-weight: 900; font-size: 1.1rem; text-transform: uppercase; }

        /* MINES GRID */
        .mines-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 15px 0; }
        .mines-square { background: #1e2a5a; height: 60px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }

        /* NAV TABS */
        .nav-tabs { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #1e2a5a; padding-bottom: calc(15px + env(safe-area-inset-bottom)); z-index: 900; }
        .tab { font-size: 1.6rem; opacity: 0.4; }
        .tab.active { opacity: 1; color: var(--primary); }

        /* MODAIS */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; align-items: center; justify-content: center; }
        .modal-body { background: var(--card); width: 85%; padding: 25px; border-radius: 30px; text-align: center; border: 1px solid var(--primary); }
    </style>
</head>
<body>

<div id="authScreen" class="auth-overlay">
    <div class="auth-box">
        <h2 id="authTitle">CADASTRAR</h2>
        <input type="text" id="userNick" placeholder="Usuário" class="input-app" maxlength="10">
        <input type="password" id="userPass" placeholder="Senha" class="input-app">
        <button onclick="handleAuth()" class="btn-play" id="btnAuth">CRIAR CONTA</button>
        <p onclick="toggleAuthMode()" style="margin-top:15px; color:var(--accent)">Já tem conta? Entre</p>
    </div>
</div>

<div id="menuOverlay" class="menu-overlay" onclick="toggleMenu()"></div>
<div id="sideMenu" class="side-menu">
    <h2 style="color:var(--primary)">MENU</h2>
    <div class="menu-item" onclick="switchG('aviator', null)">🚀 Aviator</div>
    <div class="menu-item" onclick="switchG('tiger', null)">🐯 Fortune Tiger</div>
    <div class="menu-item" onclick="switchG('mines', null)">💣 Mines</div>
    <div class="menu-item" onclick="abrirDep()">💰 Depositar PIX</div>
    <div class="menu-item" onclick="location.reload()">🚪 Sair</div>
</div>

<div id="depositoModal" class="modal">
    <div class="modal-body">
        <h3 style="color:var(--primary)">DEPÓSITO PIX</h3>
        <p>Valor: R$ <span id="valExibido">20.00</span></p>
        <input type="number" id="valorDep" class="input-app" value="20">
        <button class="btn-play" onclick="irParaMercadoPago()">PAGAR COM MERCADO PAGO</button>
        <button onclick="fecharDep()" style="background:none; border:none; color:gray; margin-top:15px;">Voltar</button>
    </div>
</div>

<div id="mainApp" style="display:none;">
    <header class="header">
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div style="font-weight:900;" onclick="abrirAdmin()">ESPORTES VIP</div>
        <div class="balance-btn">R$ <span id="spanSaldo">0.00</span></div>
    </header>

    <div class="vip-container">
        <div style="font-size:0.7rem; display:flex; justify-content:space-between;">
            <span>NÍVEL VIP: <b id="rank-name">BRONZE</b></span>
            <span id="vip-percent">0%</span>
        </div>
        <div class="vip-bar-bg"><div id="vip-progress"></div></div>
    </div>

    <div class="game-container">
        <div id="game-aviator" class="game-card active">
            <h3 style="color:var(--accent)">🚀 AVIATOR</h3>
            <div class="display-main"><div id="multiplier" style="font-size:3.5rem; font-weight:900;">1.00x</div></div>
            <div class="bet-selector">
                <button class="bet-btn" onclick="altBet(-1)">-</button>
                <span id="valAposta">R$ 2.00</span>
                <button class="bet-btn" onclick="altBet(1)">+</button>
            </div>
            <button id="btnAviator" class="btn-play">APOSTAR</button>
        </div>

        <div id="game-tiger" class="game-card">
            <h3 style="color:var(--gold)">🐯 TIGRINHO</h3>
            <div class="display-main" style="font-size:3rem; gap:10px;">
                <span id="t1">🐯</span><span id="t2">🐯</span><span id="t3">🐯</span>
            </div>
            <button onclick="jogarTiger()" class="btn-play" style="background:var(--gold)">GIRAR</button>
        </div>

        <div id="game-mines" class="game-card">
            <h3 style="color:var(--danger)">💣 MINES</h3>
            <div id="minesProfit" style="color:var(--primary); margin-bottom:10px;">LUCRO: R$ 0.00</div>
            <div class="mines-grid" id="minesGrid"></div>
            <button id="btnMines" onclick="iniciarMines()" class="btn-play" style="background:var(--danger)">INICIAR JOGO</button>
        </div>
    </div>

    <nav class="nav-tabs">
        <span class="tab" onclick="switchG('tiger', this)">🐯</span>
        <span class="tab active" onclick="switchG('aviator', this)">🚀</span>
        <span class="tab" onclick="switchG('mines', this)">💣</span>
    </nav>
</div>

<script>
    let saldo = parseFloat(localStorage.getItem('saldo')) || 0.00;
    let exp = parseInt(localStorage.getItem('exp')) || 0;
    let aposta = 2.00;
    let rodando = false;
    let isLogin = false;

    // MENU
    function toggleMenu() {
        document.getElementById('sideMenu').classList.toggle('active');
        document.getElementById('menuOverlay').classList.toggle('active');
    }

    // AUTH
    function handleAuth() {
        const u = document.getElementById('userNick').value;
        const p = document.getElementById('userPass').value;
        if(!isLogin) { localStorage.setItem('u', u); localStorage.setItem('p', p); alert("Criado!"); location.reload(); }
        else { if(u === localStorage.getItem('u') && p === localStorage.getItem('p')) entrar(); else alert("Erro!"); }
    }
    function toggleAuthMode() { isLogin = !isLogin; document.getElementById('authTitle').innerText = isLogin ? "ENTRAR" : "CADASTRAR"; }
    function entrar() { document.getElementById('authScreen').style.display='none'; document.getElementById('mainApp').style.display='block'; atualizar(); renderGrid(); }

    // FINANCEIRO
    function abrirDep() { toggleMenu(); document.getElementById('depositoModal').style.display='flex'; }
    function fecharDep() { document.getElementById('depositoModal').style.display='none'; }
    function irParaMercadoPago() { 
        let v = parseFloat(document.getElementById('valorDep').value);
        saldo += v; alert("Simulando Mercado Pago: R$ "+v+" adicionados!"); atualizar(); fecharDep();
    }
    function abrirAdmin() { if(prompt("Senha:")==="123") { saldo += parseFloat(prompt("Valor:")); atualizar(); } }

    function atualizar() {
        document.getElementById('spanSaldo').innerText = saldo.toFixed(2);
        document.getElementById('valAposta').innerText = "R$ " + aposta.toFixed(2);
        document.getElementById('vip-progress').style.width = (exp % 100) + "%";
        localStorage.setItem('saldo', saldo);
    }

    function altBet(v) { aposta = Math.max(1, aposta + v); atualizar(); }

    function switchG(g, el) {
        document.querySelectorAll('.game-card').forEach(c => c.classList.remove('active'));
        document.getElementById('game-'+g).classList.add('active');
        if(el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }
        if(g === 'mines') renderGrid();
        if(document.getElementById('sideMenu').classList.contains('active')) toggleMenu();
    }

    // JOGOS (Lógica Aviator, Tiger e Mines mantida 100%)
    document.getElementById('btnAviator').onclick = function() {
        if(rodando) { rodando = false; return; }
        if(saldo < aposta) return alert("Sem saldo");
        saldo -= aposta; rodando = true;
        let m = 1.00; let crash = (Math.random() * 3 + 1.2).toFixed(2);
        this.innerText = "CASH OUT";
        let loop = setInterval(() => {
            if(!rodando) { clearInterval(loop); saldo += (aposta * m); exp+=5; resetA(); return; }
            m += 0.05; document.getElementById('multiplier').innerText = m.toFixed(2) + "x";
            if(m >= crash) { clearInterval(loop); rodando = false; alert("Crash!"); resetA(); }
        }, 100);
    };
    function resetA() { document.getElementById('btnAviator').innerText = "APOSTAR"; atualizar(); }

    function jogarTiger() {
        if(saldo < aposta) return alert("Sem saldo");
        saldo -= aposta; exp+=10;
        let t = setInterval(() => {
            const e = ["🐯","💰","🧧"];
            document.getElementById('t1').innerText = e[Math.floor(Math.random()*3)];
            document.getElementById('t2').innerText = e[Math.floor(Math.random()*3)];
            document.getElementById('t3').innerText = e[Math.floor(Math.random()*3)];
        }, 100);
        setTimeout(() => { clearInterval(t); if(document.getElementById('t1').innerText == document.getElementById('t2').innerText) { saldo += aposta*5; alert("Ganhou!"); } atualizar(); }, 1000);
    }

    let mOn = false; let bPos = -1; let lMines = 0;
    function renderGrid() {
        const grid = document.getElementById('minesGrid'); grid.innerHTML = "";
        for(let i=0; i<16; i++) {
            let s = document.createElement('div'); s.className = 'mines-square';
            s.onclick = () => {
                if(!mOn || s.innerText != "") return;
                if(i === bPos) { s.innerText = "💣"; s.style.background = "red"; alert("Boom!"); mOn=false; atualizar(); }
                else { s.innerText = "💎"; s.style.background = "green"; lMines *= 1.5; document.getElementById('minesProfit').innerText = "LUCRO: R$ "+lMines.toFixed(2); }
            };
            grid.appendChild(s);
        }
    }
    function iniciarMines() {
        if(!mOn) { if(saldo < aposta) return alert("Sem saldo"); saldo -= aposta; mOn = true; lMines = aposta; bPos = Math.floor(Math.random()*16); renderGrid(); atualizar(); document.getElementById('btnMines').innerText = "COLETAR"; }
        else { saldo += lMines; mOn = false; document.getElementById('btnMines').innerText = "INICIAR"; atualizar(); }
    }
</script>
</body>
</html>
